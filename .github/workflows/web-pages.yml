name: Build or deploy static web app
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the reviewed main revision to GitHub Pages'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run typecheck
      - run: npm run web:build
      - run: npm run web:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orgchart-static-public
          path: public/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: inputs.deploy && github.ref == 'refs/heads/main'
        with:
          path: public/
  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy reviewed static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
