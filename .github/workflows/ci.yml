name: Test desktop app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run security, type, build, and behavior tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Validate release metadata
        run: npm run validate:release

  source-desktop-smoke:
    name: Command-line install - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15
            os: macos-15
            platform: mac
          - name: Windows x64
            os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Create current-revision source archive on macOS
        if: matrix.platform == 'mac'
        run: git archive --format=zip --prefix=Org-Chart-Studio-ci/ HEAD -o "$RUNNER_TEMP/orgchart-source.zip"

      - name: Exercise macOS fresh install and update bootstrap
        if: matrix.platform == 'mac'
        env:
          ORGCHART_SOURCE_ARCHIVE_URL: ${{ runner.temp }}/orgchart-source.zip
          ORGCHART_SOURCE_REVISION: ${{ github.sha }}
          ORGCHART_BOOTSTRAP_SKIP_SETUP: "1"
        run: |
          target="$RUNNER_TEMP/OrgChart-Studio-source-test"
          /bin/zsh scripts/bootstrap-mac-source-test.zsh "$target"
          mkdir -p "$target/.runtime" "$target/node_modules" "$target/output"
          touch "$target/.runtime/preserved" "$target/node_modules/preserved" "$target/output/preserved"
          touch "$target/obsolete-update-test.txt"
          /bin/zsh scripts/bootstrap-mac-source-test.zsh "$target"
          test -f "$target/.runtime/preserved"
          test -f "$target/node_modules/preserved"
          test -f "$target/output/preserved"
          test ! -e "$target/obsolete-update-test.txt"
          grep -F "Installed commit: $GITHUB_SHA" "$target/INSTALL-REVISION.txt"
          grep -F "Platform: macOS" "$target/INSTALL-REVISION.txt"

      - name: Exercise public no-auth macOS bootstrap
        if: matrix.platform == 'mac' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          ORGCHART_BOOTSTRAP_SKIP_SETUP: "1"
        run: |
          target="$RUNNER_TEMP/OrgChart-Studio-public-download"
          /bin/zsh scripts/bootstrap-mac-source-test.zsh "$target"
          grep -F "Installed commit: $GITHUB_SHA" "$target/INSTALL-REVISION.txt"

      - name: Complete macOS command-line setup and GUI smoke
        if: matrix.platform == 'mac'
        env:
          ORGCHART_SETUP_MCP: skip
          ORGCHART_SETUP_STAGE_ONLY: "1"
          ORGCHART_FORCE_PORTABLE_NODE: "1"
        run: /bin/zsh "$RUNNER_TEMP/OrgChart-Studio-source-test/scripts/setup-mac-source-test.zsh"

      - name: Start the installed Mac copy through its user launcher
        if: matrix.platform == 'mac'
        env:
          ORGCHART_ELECTRON_SMOKE: "1"
        run: /bin/zsh "$RUNNER_TEMP/OrgChart-Studio-source-test/Start-OrgChart-Studio.command"

      - name: Create current-revision source archive on Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: git archive --format=zip --prefix=Org-Chart-Studio-ci/ HEAD -o "$env:RUNNER_TEMP\orgchart-source.zip"

      - name: Parse every Windows PowerShell entry point
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $parseErrors = @()
          foreach ($script in (Get-ChildItem -LiteralPath .\scripts -Filter *.ps1)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          foreach ($parseError in $parseErrors) {
            Write-Error ("{0}:{1}:{2}: {3}" -f `
              $parseError.Extent.File,
              $parseError.Extent.StartLineNumber,
              $parseError.Extent.StartColumnNumber,
              $parseError.Message)
          }
          if ($parseErrors.Count -gt 0) {
            throw "One or more Windows PowerShell scripts did not parse."
          }

      - name: Exercise Windows fresh install and update bootstrap
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          ORGCHART_SOURCE_ARCHIVE_URL: ${{ runner.temp }}\orgchart-source.zip
          ORGCHART_SOURCE_REVISION: ${{ github.sha }}
          ORGCHART_BOOTSTRAP_SKIP_SETUP: "1"
        run: |
          $target = Join-Path $env:RUNNER_TEMP "OrgChart-Studio-source-test"
          & .\scripts\bootstrap-windows-source-test.ps1 -TargetDirectory $target
          New-Item -ItemType Directory -Force -Path "$target\.runtime", "$target\node_modules", "$target\output" | Out-Null
          New-Item -ItemType File -Force -Path "$target\.runtime\preserved", "$target\node_modules\preserved", "$target\output\preserved", "$target\obsolete-update-test.txt" | Out-Null
          & .\scripts\bootstrap-windows-source-test.ps1 -TargetDirectory $target
          if (-not (Test-Path "$target\.runtime\preserved")) { throw "The private runtime was not preserved." }
          if (-not (Test-Path "$target\node_modules\preserved")) { throw "Dependencies were not preserved." }
          if (-not (Test-Path "$target\output\preserved")) { throw "Local output was not preserved." }
          if (Test-Path "$target\obsolete-update-test.txt") { throw "The source update did not remove obsolete source files." }
          $revision = Get-Content "$target\INSTALL-REVISION.txt" -Raw
          if (-not $revision.Contains("Installed commit: $env:GITHUB_SHA")) { throw "The exact revision was not recorded." }
          if (-not $revision.Contains("Platform: Windows")) { throw "The Windows platform was not recorded." }

      - name: Exercise public no-auth Windows bootstrap
        if: matrix.platform == 'windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          ORGCHART_BOOTSTRAP_SKIP_SETUP: "1"
        run: |
          $target = Join-Path $env:RUNNER_TEMP "OrgChart-Studio-public-download"
          & .\scripts\bootstrap-windows-source-test.ps1 -TargetDirectory $target
          $revision = Get-Content "$target\INSTALL-REVISION.txt" -Raw
          if (-not $revision.Contains("Installed commit: $env:GITHUB_SHA")) {
            throw "The public Windows bootstrap did not install the triggering revision."
          }

      - name: Complete Windows command-line setup and GUI smoke
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          ORGCHART_SETUP_MCP: skip
          ORGCHART_SETUP_STAGE_ONLY: "1"
          ORGCHART_FORCE_PORTABLE_NODE: "1"
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "OrgChart-Studio-source-test\scripts\setup-windows-source-test.ps1"
          & $setup
          if ($LASTEXITCODE -ne 0) { throw "Windows command-line setup failed with exit code $LASTEXITCODE." }

      - name: Start the installed Windows copy through its user launcher
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          ORGCHART_ELECTRON_SMOKE: "1"
          ORGCHART_LAUNCH_NO_PAUSE: "1"
        run: |
          $target = Join-Path $env:RUNNER_TEMP "OrgChart-Studio-source-test"
          Push-Location $target
          try {
            & cmd.exe /d /c "Start-OrgChart-Studio.cmd"
            if ($LASTEXITCODE -ne 0) {
              throw "The installed Windows launcher failed with exit code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
          }
